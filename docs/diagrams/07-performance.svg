<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960"><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="42.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23.9" fill="#1e1e1e" font-weight="bold">What it costs: measured numbers (software rendered test shell, one core = 100%)</text><text x="40.0" y="88.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40">GNOME Shell CPU while each case runs, 30 s window (shorter bar is better)</text><text x="40.0" y="146.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">A. extension OFF (baseline)</text><rect x="470" y="115" width="43.92156862745098" height="44" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="527.9" y="144.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">0.7%</text><text x="40.0" y="208.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">B. extension on, no agents</text><rect x="470" y="177" width="200.78431372549022" height="44" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="684.8" y="206.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">3.2%</text><text x="40.0" y="270.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">C. two agents working (motion)</text><rect x="470" y="239" width="87.84313725490196" height="44" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="571.8" y="268.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">1.4%</text><text x="40.0" y="332.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">D. working + play mode roaming</text><rect x="470" y="301" width="640.0" height="44" rx="8" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text x="1124.0" y="330.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">10.2%</text><text x="40.0" y="394.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">E. both done (attention bounce)</text><rect x="470" y="363" width="250.98039215686276" height="44" rx="8" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="735.0" y="392.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">4.0%</text><text x="40.0" y="456.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">F. working, motion switched off</text><rect x="470" y="425" width="37.64705882352941" height="44" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="521.6" y="454.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">0.6%</text><text x="40.0" y="525.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40">One Claude hook run (milliseconds, mean of 40), paid on every Claude event</text><text x="40.0" y="579.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">Our hook (python3)</text><rect x="470" y="552" width="409.20000000000005" height="36" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="893.2" y="577.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">34.1 ms</text><text x="40.0" y="629.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">Empty Python program</text><rect x="470" y="602" width="253.20000000000002" height="36" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="737.2" y="627.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">21.1 ms</text><text x="40.0" y="679.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">Empty Python with -S</text><rect x="470" y="652" width="129.60000000000002" height="36" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="613.6" y="677.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">10.8 ms</text><text x="40.0" y="729.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#212529">An empty program (/bin/true)</text><rect x="470" y="702" width="6.0" height="36" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="490.0" y="727.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#212529">0.5 ms</text><rect x="40" y="777" width="1420" height="120" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text x="750.0" y="813.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Reading the picture: the extension itself is lost in the noise (A, B, C, E, F are all within a few percent of one core).</text><text x="750.0" y="833.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Play mode (D) is the one expensive feature: a JavaScript timer moves widgets 30 times a second.</text><text x="750.0" y="853.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Memory is not shown: with versus without the extension differs by less than the run to run noise of about 10 MB.</text><text x="750.0" y="873.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Every bar comes from scripts/measure.py, which you can run yourself. Percentages are indicative within about 2 points.</text></svg>