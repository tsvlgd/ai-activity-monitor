<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960"><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="42.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23.9" fill="#1e1e1e" font-weight="bold">GlanceAgent: the whole system on one page</text><ellipse cx="750.0" cy="480.0" rx="160.0" ry="70.0" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text x="750.0" y="451.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#1e1e1e">AI Activity</text><text x="750.0" y="475.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#1e1e1e">Monitor</text><text x="750.0" y="499.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#1e1e1e">one GNOME extension</text><text x="750.0" y="522.8" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17.5" fill="#1e1e1e">plus two small adapters</text><rect x="40" y="90" width="430" height="200" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="255.0" y="143.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">1  INPUT: the agents report</text><text x="255.0" y="164.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e"></text><text x="255.0" y="185.8" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Claude Code: a hook script runs on</text><text x="255.0" y="207.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">every event, JSON arrives on stdin</text><text x="255.0" y="228.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">OpenCode: a plugin listens to the</text><text x="255.0" y="249.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">server's internal event stream</text><rect x="535" y="70" width="430" height="200" rx="12" fill="#c3fae8" stroke="#06b6d4" stroke-width="2"/><text x="750.0" y="123.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">2  TRANSPORT: files in RAM</text><text x="750.0" y="144.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e"></text><text x="750.0" y="165.8" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">One small JSON line per event in</text><text x="750.0" y="187.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">$XDG_RUNTIME_DIR/ai-activity-monitor</text><text x="750.0" y="208.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">The kernel tells us when a file</text><text x="750.0" y="229.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">changes (inotify). No network</text><rect x="1030" y="90" width="430" height="200" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="1245.0" y="143.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">3  BRAIN: pure logic</text><text x="1245.0" y="164.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e"></text><text x="1245.0" y="185.8" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Events become session states:</text><text x="1245.0" y="207.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">idle, working, waiting, completed,</text><text x="1245.0" y="228.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">error, ended. Decides what to show</text><text x="1245.0" y="249.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">and when to notify</text><rect x="1030" y="660" width="430" height="250" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1245.0" y="727.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">4  OUTPUT: what you see</text><text x="1245.0" y="748.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e"></text><text x="1245.0" y="770.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Top bar icons (every window)</text><text x="1245.0" y="791.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Desktop tiles (empty desktop, play)</text><text x="1245.0" y="812.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Preview card, Open in Terminal</text><text x="1245.0" y="833.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">GNOME notifications</text><text x="1245.0" y="855.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Motion and colour show the state</text><rect x="535" y="740" width="430" height="190" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="750.0" y="798.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">5  LINUX pieces used</text><text x="750.0" y="820.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e"></text><text x="750.0" y="841.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">GNOME Shell and GJS (JavaScript)</text><text x="750.0" y="862.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Wayland, /proc, D-Bus, tmpfs</text><text x="750.0" y="883.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">inotify, gsettings, flock</text><rect x="40" y="660" width="430" height="250" rx="12" fill="#eebefa" stroke="#ec4899" stroke-width="2"/><text x="255.0" y="738.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">6  TRUST: how we know it works</text><text x="255.0" y="759.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e"></text><text x="255.0" y="780.8" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">62 automated tests</text><text x="255.0" y="802.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Independent review, 4 High fixed</text><text x="255.0" y="823.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Installer with backups, uninstaller</text><text x="255.0" y="844.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Secrets redacted, costs measured</text><path d="M647.7,426.2 L560.0,380.0 L415.5,290.0" fill="none" stroke="#868e96" stroke-width="2"/><polygon points="415.5,290.0 429.4,292.2 423.6,301.4" fill="#868e96"/><path d="M750.0,410.0 L750.0,270.0" fill="none" stroke="#868e96" stroke-width="2"/><polygon points="750.0,270.0 755.5,282.9 744.5,282.9" fill="#868e96"/><path d="M852.3,426.2 L940.0,380.0 L1084.5,290.0" fill="none" stroke="#868e96" stroke-width="2"/><polygon points="1084.5,290.0 1076.4,301.4 1070.6,292.2" fill="#868e96"/><path d="M841.1,537.5 L940.0,600.0 L1038.9,660.0" fill="none" stroke="#868e96" stroke-width="2"/><polygon points="1038.9,660.0 1025.1,658.0 1030.7,648.7" fill="#868e96"/><path d="M750.0,550.0 L750.0,740.0" fill="none" stroke="#868e96" stroke-width="2"/><polygon points="750.0,740.0 744.5,727.1 755.5,727.1" fill="#868e96"/><path d="M658.9,537.5 L560.0,600.0 L461.1,660.0" fill="none" stroke="#868e96" stroke-width="2"/><polygon points="461.1,660.0 469.3,648.7 474.9,658.0" fill="#868e96"/><path d="M470.0,181.3 L535.0,178.7" fill="none" stroke="#1971c2" stroke-width="3"/><polygon points="535.0,178.7 522.3,184.7 521.9,173.8" fill="#1971c2"/><rect x="454.0" y="168.6" width="97.0" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="502.5" y="185.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">JSON lines</text><path d="M965.0,178.7 L1030.0,181.3" fill="none" stroke="#1971c2" stroke-width="3"/><polygon points="1030.0,181.3 1016.9,186.2 1017.3,175.3" fill="#1971c2"/><rect x="940.3" y="168.6" width="114.4" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="997.5" y="185.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">file changed</text><path d="M1245.0,290.0 L1245.0,660.0" fill="none" stroke="#1971c2" stroke-width="3"/><polygon points="1245.0,660.0 1239.5,647.1 1250.5,647.1" fill="#1971c2"/><rect x="1183.5" y="445.1" width="123.1" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="1245.0" y="462.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">state to draw</text><text x="40.0" y="336.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">Blue arrows: the order data flows.</text><text x="40.0" y="356.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">Grey arrows: supporting parts.</text></svg>