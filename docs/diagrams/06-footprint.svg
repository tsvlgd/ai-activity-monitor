<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="42.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23.9" fill="#1e1e1e" font-weight="bold">What this system puts on a machine, and how to remove it</text><rect x="20" y="70" width="470" height="640" rx="18" fill="#dbe4ff" fill-opacity="0.55" stroke="#4a9eed" stroke-width="1.5"/><text x="34.0" y="96.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">FILES we installed</text><rect x="40" y="120" width="430" height="150" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="255.0" y="171.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">~/.local/share/gnome-shell/</text><text x="255.0" y="191.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">extensions/ai-activity-monitor@local/</text><text x="255.0" y="211.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">the extension: JS, CSS, icons,</text><text x="255.0" y="231.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">settings schema</text><rect x="40" y="300" width="430" height="120" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="255.0" y="346.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">~/.local/share/ai-activity-monitor/</text><text x="255.0" y="366.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">aimon_hook.py</text><text x="255.0" y="386.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">copy of the Claude hook</text><rect x="40" y="450" width="430" height="120" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="255.0" y="496.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">~/.config/opencode/plugins/</text><text x="255.0" y="516.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">ai-activity-monitor.js</text><text x="255.0" y="536.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">copy of the OpenCode plugin</text><rect x="40" y="600" width="430" height="90" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text x="255.0" y="641.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">source of truth: this</text><text x="255.0" y="661.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">repository (git)</text><rect x="510" y="70" width="470" height="640" rx="18" fill="#ffe8cc" fill-opacity="0.55" stroke="#f59e0b" stroke-width="1.5"/><text x="524.0" y="96.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">SETTINGS we edited</text><rect x="530" y="120" width="430" height="170" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="745.0" y="181.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">~/.claude/settings.json</text><text x="745.0" y="201.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">+ 11 hook entries, each runs</text><text x="745.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">aimon_hook.py. Other hooks kept.</text><text x="745.0" y="241.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Backup: settings.json.aimon-backup-*</text><rect x="530" y="320" width="430" height="120" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="745.0" y="366.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">dconf: org.gnome.shell</text><text x="745.0" y="386.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">enabled-extensions</text><text x="745.0" y="406.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">+ ai-activity-monitor@local</text><rect x="530" y="470" width="430" height="120" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="745.0" y="516.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">dconf: /org/gnome/shell/extensions/</text><text x="745.0" y="536.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">ai-activity-monitor/</text><text x="745.0" y="556.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">our preferences (positions, switches)</text><rect x="1000" y="70" width="480" height="640" rx="18" fill="#d3f9d8" fill-opacity="0.55" stroke="#22c55e" stroke-width="1.5"/><text x="1014.0" y="96.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">RUNTIME (temporary)</text><rect x="1020" y="120" width="440" height="150" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1240.0" y="171.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">$XDG_RUNTIME_DIR/ai-activity-monitor/</text><text x="1240.0" y="191.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">spool/*.jsonl and .lock</text><text x="1240.0" y="211.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">RAM only, gone at logout or reboot,</text><text x="1240.0" y="231.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">capped 256 KB per session</text><rect x="1020" y="300" width="440" height="120" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1240.0" y="356.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">gnome-shell loads the extension</text><text x="1240.0" y="376.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">at login (Wayland rule)</text><rect x="1020" y="450" width="440" height="120" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1240.0" y="506.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">OpenCode server loads the plugin</text><text x="1240.0" y="526.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">when the server starts</text><rect x="1020" y="600" width="440" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1240.0" y="641.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Claude runs the hook per event</text><text x="1240.0" y="661.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">only in NEW Claude sessions</text><rect x="20" y="740" width="1460" height="130" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text x="750.0" y="790.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">REMOVE EVERYTHING:   scripts/uninstall.sh   (try --dry-run first)</text><text x="750.0" y="811.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Removes the extension and its settings, only OUR hook entries from settings.json, the OpenCode plugin, the spool.</text><text x="750.0" y="832.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Exact rollback of settings.json: copy back the newest settings.json.aimon-backup-* file.</text></svg>