<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930"><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="42.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23.9" fill="#1e1e1e" font-weight="bold">Who runs where: the real processes and how they talk</text><rect x="30" y="110" width="320" height="120" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="190.0" y="155.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">claude (Claude Code)</text><text x="190.0" y="176.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">long lived process</text><text x="190.0" y="197.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">in one terminal tab</text><rect x="30" y="320" width="320" height="110" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="190.0" y="360.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">aimon_hook.py</text><text x="190.0" y="381.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">started by Claude per event,</text><text x="190.0" y="402.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">exits in about 35 ms</text><rect x="30" y="540" width="340" height="140" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="200.0" y="584.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">opencode serve --service</text><text x="200.0" y="605.8" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">one background server,</text><text x="200.0" y="627.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">all OpenCode sessions live here</text><text x="200.0" y="648.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">plus our plugin, inside it</text><rect x="30" y="760" width="320" height="100" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="190.0" y="795.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">opencode (TUI client)</text><text x="190.0" y="816.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">your terminal tab,</text><text x="190.0" y="837.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">the screen you type in</text><rect x="540" y="320" width="300" height="180" rx="12" fill="#c3fae8" stroke="#06b6d4" stroke-width="2"/><text x="690.0" y="384.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Spool folder in RAM</text><text x="690.0" y="405.8" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">$XDG_RUNTIME_DIR/</text><text x="690.0" y="427.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">ai-activity-monitor/spool</text><text x="690.0" y="448.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">files, not a process</text><rect x="530" y="640" width="320" height="230" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text x="690.0" y="718.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Linux kernel</text><text x="690.0" y="740.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">inotify: file change alerts</text><text x="690.0" y="761.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">/proc: facts about processes</text><text x="690.0" y="782.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">pipes: stdin to the hook</text><text x="690.0" y="803.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">tmpfs: files kept in RAM</text><rect x="1010" y="150" width="440" height="330" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="1230.0" y="257.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">gnome-shell (the compositor)</text><text x="1230.0" y="278.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">ONE process draws your whole</text><text x="1230.0" y="300.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">desktop and runs all extensions.</text><text x="1230.0" y="321.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">Our extension is JavaScript</text><text x="1230.0" y="342.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">(GJS) inside it:</text><text x="1230.0" y="363.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">about 3,662 lines in 18 files</text><text x="1230.0" y="385.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">running on its main thread</text><rect x="1010" y="650" width="440" height="150" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="1230.0" y="710.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">gnome-terminal-server</text><text x="1230.0" y="731.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">owns every terminal window</text><text x="1230.0" y="752.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">and tab (one process)</text><path d="M190.0,230.0 L190.0,320.0" fill="none" stroke="#e8590c" stroke-width="2"/><polygon points="190.0,320.0 184.5,307.1 195.5,307.1" fill="#e8590c"/><rect x="106.7" y="254.2" width="166.6" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="190.0" y="271.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">spawns, pipes JSON</text><text x="190.0" y="290.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">to its stdin</text><path d="M350.0,386.2 L540.0,399.5" fill="none" stroke="#e8590c" stroke-width="2"/><polygon points="540.0,399.5 526.8,404.0 527.5,393.2" fill="#e8590c"/><rect x="374.8" y="381.5" width="140.5" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="445.0" y="398.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">append one line</text><path d="M370.0,601.5 L400.0,600.0 L400.0,450.0 L540.0,430.7" fill="none" stroke="#e8590c" stroke-width="2"/><polygon points="540.0,430.7 528.0,437.9 526.5,427.1" fill="#e8590c"/><rect x="303.6" y="513.6" width="192.7" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="400.0" y="530.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">plugin appends a line</text><path d="M192.5,760.0 L196.5,680.0" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/><polygon points="196.5,680.0 201.3,693.2 190.4,692.6" fill="#868e96"/><rect x="119.9" y="699.2" width="149.2" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="194.5" y="716.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">talks to server</text><text x="194.5" y="735.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">(their business)</text><path d="M840.0,383.6 L1010.0,353.7" fill="none" stroke="#1971c2" stroke-width="3"/><polygon points="1010.0,353.7 998.2,361.3 996.4,350.6" fill="#1971c2"/><rect x="828.6" y="357.3" width="192.7" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="925.0" y="374.3" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">inotify: file changed</text><path d="M1142.4,480.0 L1100.0,560.0 L860.0,700.0 L850.0,703.2" fill="none" stroke="#1971c2" stroke-width="2"/><polygon points="850.0,703.2 860.6,694.1 863.9,704.5" fill="#1971c2"/><rect x="861.9" y="609.2" width="236.2" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="980.0" y="626.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">reads /proc/PID every 4 s:</text><text x="980.0" y="645.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">is the agent still alive?</text><path d="M1230.0,480.0 L1230.0,650.0" fill="none" stroke="#2f9e44" stroke-width="3"/><polygon points="1230.0,650.0 1224.5,637.1 1235.5,637.1" fill="#2f9e44"/><rect x="1133.7" y="544.2" width="192.7" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="1230.0" y="561.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">D-Bus: switch tab</text><text x="1230.0" y="580.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">Wayland: raise window</text><text x="540.0" y="545.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#495057">Solid: data we send or read.</text><text x="540.0" y="563.8" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#495057">Dashed: not ours, shown for context.</text><text x="540.0" y="582.5" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#495057">Orange: written by the agents' side.</text><text x="540.0" y="601.2" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#495057">Blue/green: done inside gnome-shell.</text></svg>