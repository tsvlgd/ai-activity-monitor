<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="900" viewBox="0 0 1580 900"><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="42.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23.9" fill="#1e1e1e" font-weight="bold">One event, end to end: Claude starts a tool and the icon starts moving</text><rect x="20" y="70" width="400" height="800" rx="18" fill="#dbe4ff" fill-opacity="0.55" stroke="#4a9eed" stroke-width="1.5"/><text x="34.0" y="96.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">Terminals (agent processes)</text><rect x="440" y="70" width="270" height="800" rx="18" fill="#c3fae8" fill-opacity="0.55" stroke="#06b6d4" stroke-width="1.5"/><text x="454.0" y="96.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">A folder in RAM</text><rect x="730" y="70" width="480" height="800" rx="18" fill="#e5dbff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5"/><text x="744.0" y="96.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">gnome-shell process (our extension)</text><rect x="1230" y="70" width="330" height="800" rx="18" fill="#d3f9d8" fill-opacity="0.55" stroke="#22c55e" stroke-width="1.5"/><text x="1244.0" y="96.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">Screen</text><rect x="40" y="120" width="360" height="100" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="220.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">1. Claude Code starts a tool</text><text x="220.0" y="176.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">(Bash, Edit, Read...) after</text><text x="220.0" y="196.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">you send a prompt</text><rect x="40" y="270" width="360" height="120" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="220.0" y="306.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">2. Claude runs our hook command</text><text x="220.0" y="326.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">aimon_hook.py (short lived,</text><text x="220.0" y="346.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">about 35 ms). Event JSON arrives</text><text x="220.0" y="366.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">on its stdin</text><rect x="40" y="470" width="360" height="100" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="220.0" y="506.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">1b. OpenCode server (background)</text><text x="220.0" y="526.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">processes the same kind of event:</text><text x="220.0" y="546.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">session.tool.called</text><rect x="40" y="620" width="360" height="100" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="220.0" y="656.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">2b. Our plugin, running inside the</text><text x="220.0" y="676.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">server, receives it through</text><text x="220.0" y="696.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">ctx.event.subscribe</text><rect x="40" y="755" width="360" height="90" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text x="220.0" y="796.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Both convert to the SAME</text><text x="220.0" y="816.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">normalized line (docs/EVENTS.md)</text><rect x="455" y="250" width="240" height="380" rx="12" fill="#c3fae8" stroke="#06b6d4" stroke-width="2"/><text x="575.0" y="336.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">3. Append ONE line</text><text x="575.0" y="356.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">to the session's file</text><text x="575.0" y="376.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e"></text><text x="575.0" y="396.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">claude-code--ID.jsonl</text><text x="575.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">opencode--ID.jsonl</text><text x="575.0" y="436.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e"></text><text x="575.0" y="456.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">{"v":1, "kind":</text><text x="575.0" y="476.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e"> "tool_start",</text><text x="575.0" y="496.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e"> "detail":"Running ls",</text><text x="575.0" y="516.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e"> "ts":1794...}</text><text x="575.0" y="536.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e"></text><text x="575.0" y="556.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">files live in RAM</text><rect x="750" y="120" width="440" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="970.0" y="161.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">4. The kernel (inotify) says a file</text><text x="970.0" y="181.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">changed. SpoolWatcher wakes up</text><rect x="750" y="240" width="440" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="970.0" y="281.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">5. Read the new lines. parseEvent()</text><text x="970.0" y="301.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">throws away anything malformed</text><rect x="750" y="360" width="440" height="120" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="970.0" y="406.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">6. SessionStore.reduceSession():</text><text x="970.0" y="426.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">pure function: old state + event</text><text x="970.0" y="446.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">= new state (idle, working...)</text><rect x="750" y="510" width="440" height="90" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="970.0" y="551.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">7. decideNotification(): spam rules</text><text x="970.0" y="571.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">(dedupe, only long turns, ...)</text><rect x="750" y="630" width="440" height="110" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="970.0" y="671.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">8. extension.js render(): group by</text><text x="970.0" y="691.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">agent, tell the UI to draw. Also</text><text x="970.0" y="711.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">starts/stops the motion</text><rect x="1250" y="130" width="290" height="100" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1395.0" y="166.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Top bar icon</text><text x="1395.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">starts moving up and</text><text x="1395.0" y="206.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">down (state: working)</text><rect x="1250" y="260" width="290" height="100" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1395.0" y="306.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Desktop tile</text><text x="1395.0" y="326.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">same state, same motion</text><rect x="1250" y="390" width="290" height="100" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1395.0" y="426.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Preview card</text><text x="1395.0" y="446.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">updates when open:</text><text x="1395.0" y="466.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">"Running ls"</text><rect x="1250" y="520" width="290" height="100" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1395.0" y="556.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">GNOME notification</text><text x="1395.0" y="576.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">only for approval, error,</text><text x="1395.0" y="596.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">long turn done</text><path d="M220.0,220.0 L220.0,270.0" fill="none" stroke="#e8590c" stroke-width="2"/><polygon points="220.0,270.0 214.5,257.1 225.5,257.1" fill="#e8590c"/><rect x="167.2" y="233.6" width="105.7" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="220.0" y="250.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">event fires</text><path d="M400.0,385.8 L455.0,402.8" fill="none" stroke="#e8590c" stroke-width="2"/><polygon points="455.0,402.8 441.1,404.2 444.3,393.8" fill="#e8590c"/><rect x="365.9" y="382.9" width="123.1" height="22.8" 