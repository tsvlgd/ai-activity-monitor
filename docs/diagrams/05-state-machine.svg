<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="42.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23.9" fill="#1e1e1e" font-weight="bold">The brain: six session states and what moves a session between them</text><ellipse cx="155.0" cy="385.0" rx="115.0" ry="55.0" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="155.0" y="370.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">idle</text><text x="155.0" y="391.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">open, waiting for</text><text x="155.0" y="412.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">your next prompt</text><ellipse cx="650.0" cy="395.0" rx="130.0" ry="65.0" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="650.0" y="380.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">working</text><text x="650.0" y="401.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">generating text or</text><text x="650.0" y="422.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">running a tool</text><ellipse cx="650.0" cy="155.0" rx="130.0" ry="65.0" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="650.0" y="140.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">waiting</text><text x="650.0" y="161.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">needs approval or</text><text x="650.0" y="182.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">an answer from you</text><ellipse cx="1170.0" cy="395.0" rx="130.0" ry="65.0" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="1170.0" y="380.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">completed</text><text x="1170.0" y="401.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">turn finished</text><text x="1170.0" y="422.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">(blue dot, bounces)</text><ellipse cx="650.0" cy="665.0" rx="130.0" ry="65.0" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/><text x="650.0" y="650.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">error</text><text x="650.0" y="671.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">turn failed</text><text x="650.0" y="692.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">(red dot, bounces)</text><ellipse cx="1170.0" cy="695.0" rx="130.0" ry="55.0" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text x="1170.0" y="680.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">ended</text><text x="1170.0" y="701.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">session gone,</text><text x="1170.0" y="722.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15.6" fill="#1e1e1e">icon removed</text><path d="M269.9,387.3 L520.1,392.4" fill="none" stroke="#2f9e44" stroke-width="3"/><polygon points="520.1,392.4 507.1,397.6 507.3,386.7" fill="#2f9e44"/><rect x="363.9" y="378.5" width="62.2" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="395.0" y="395.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">prompt</text><path d="M602.6,334.5 L560.0,280.0 L606.0,216.2" fill="none" stroke="#e8590c" stroke-width="2"/><polygon points="606.0,216.2 602.9,229.8 594.0,223.4" fill="#e8590c"/><rect x="517.1" y="227.3" width="131.8" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="583.0" y="244.3" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">permission or</text><text x="583.0" y="263.1" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">question asked</text><path d="M702.4,214.5 L760.0,280.0 L706.1,336.4" fill="none" stroke="#2f9e44" stroke-width="2"/><polygon points="706.1,336.4 711.1,323.3 718.9,330.8" fill="#2f9e44"/><rect x="665.3" y="226.5" width="131.8" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="731.2" y="243.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">answered:</text><text x="731.2" y="262.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">agent moves on</text><path d="M780.0,395.0 L1040.0,395.0" fill="none" stroke="#1971c2" stroke-width="3"/><polygon points="1040.0,395.0 1027.1,400.5 1027.1,389.5" fill="#1971c2"/><rect x="848.5" y="374.2" width="123.1" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="910.0" y="391.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">turn_complete</text><text x="910.0" y="410.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">(Stop hook)</text><path d="M650.0,460.0 L650.0,600.0" fill="none" stroke="#e03131" stroke-width="2"/><polygon points="650.0,600.0 644.5,587.1 655.5,587.1" fill="#e03131"/><rect x="588.5" y="548.5" width="123.1" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="650.0" y="565.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">turn_error</text><text x="650.0" y="584.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">(StopFailure)</text><path d="M1170.0,460.0 L1170.0,530.0 L155.0,530.0 L155.0,440.0" fill="none" stroke="#868e96" stroke-width="2"/><polygon points="155.0,440.0 160.5,452.9 149.5,452.9" fill="#868e96"/><rect x="819.9" y="499.9" width="192.7" height="60.2" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="916.2" y="516.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">hold time passes</text><text x="916.2" y="535.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">(3 min) or new prompt</text><text x="916.2" y="554.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">returns to working</text><path d="M520.0,665.0 L155.0,665.0 L155.0,440.0" fill="none" stroke="#868e96" stroke-width="2"/><polygon points="155.0,440.0 160.5,452.9 149.5,452.9" fill="#868e96"/><rect x="262.9" y="653.6" width="149.2" height="22.8" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="337.5" y="670.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">hold time passes</text><path d="M550.5,353.2 L400.0,290.0 L244.3,350.4" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/><polygon points="244.3,350.4 254.4,340.6 258.3,350.8" fill="#868e96"/><rect x="217.1" y="299.4" width="210.1" height="41.5" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="322.2" y="316.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">interrupt, or no events</text><text x="322.2" y="335.2" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">for 20 min (stale)</text><path d="M1284.9,425.4 L1340.0,440.0 L1340.0,640.0 L1273.3,661.6" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/><polygon points="1273.3,661.6 1283.9,652.4 1287.2,662.8" fill="#e03131"/><rect x="1265.4" y="509.9" width="149.2" height="60.2" rx="5" fill="#ffffff" fill-opacity="0.92"/><text x="1340.0" y="526.9" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">session_end,</text><text x="1340.0" y="545.6" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">or the agent</text><text x="1340.0" y="564.4" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.8" fill="#212529">process vanished</text><text x="40.0" y="776.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">From ANY state: session_end (clean exit) or process gone</text><text x="40.0" y="796.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">(terminal killed) moves a session to ended. Process gone also</text><text x="40.0" y="816.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">raises the 'ended unexpectedly' notification.</text><text x="40.0" y="136.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">Dismiss on the preview card does NOT change the state.</text><text x="40.0" y="156.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">It marks the result as seen: the icon stays, the bounce stops.</text><text x="40.0" y="176.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">A new state makes it news again.</text><text x="840.0" y="106.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">Several sessions of one agent share one icon:</text><text x="840.0" y="126.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">the highest priority state wins</text><text x="840.0" y="146.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#495057">(waiting &gt; error &gt; working &gt; completed &gt; idle).</text></svg>