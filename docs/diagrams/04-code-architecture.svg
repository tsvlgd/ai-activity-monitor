<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1070" viewBox="0 0 1640 1070"><rect width="100%" height="100%" fill="#ffffff"/><text x="24.0" y="42.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23.9" fill="#1e1e1e" font-weight="bold">Source code map: layers and who may depend on whom</text><rect x="20" y="70" width="1600" height="190" rx="18" fill="#dbe4ff" fill-opacity="0.55" stroke="#4a9eed" stroke-width="1.5"/><text x="34.0" y="96.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">ADAPTERS: run OUTSIDE GNOME. Both write lines into the spool folder that lib/spool.js watches</text><rect x="40" y="120" width="480" height="120" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="280.0" y="166.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">adapters/claude-code/aimon_hook.py (310 lines)</text><text x="280.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Python. Hook JSON in, one spool line out.</text><text x="280.0" y="206.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Redacts secrets, finds the agent PID</text><rect x="540" y="120" width="530" height="120" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="805.0" y="166.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">adapters/opencode/ai-activity-monitor.js (373 lines)</text><text x="805.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">JS plugin. Subscribes to the event bus,</text><text x="805.0" y="206.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">maps to the same line, one writer per server</text><rect x="1090" y="120" width="510" height="120" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/><text x="1345.0" y="166.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">docs/EVENTS.md: THE CONTRACT</text><text x="1345.0" y="186.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">both adapters write this schema,</text><text x="1345.0" y="206.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">the extension reads it</text><rect x="20" y="310" width="1600" height="180" rx="18" fill="#e5dbff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5"/><text x="34.0" y="336.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">PURE CORE: no GNOME imports, unit tested in plain Node</text><rect x="40" y="360" width="400" height="110" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="240.0" y="401.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/core/model.js (430 lines)</text><text x="240.0" y="421.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">event kinds, parseEvent, reduceSession:</text><text x="240.0" y="441.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">THE state machine. aggregateProvider</text><rect x="460" y="360" width="360" height="110" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="640.0" y="401.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/core/store.js (124 lines)</text><text x="640.0" y="421.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">SessionStore: holds all sessions,</text><text x="640.0" y="441.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">feeds events in, keeps notify memory</text><rect x="840" y="360" width="360" height="110" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="1020.0" y="401.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/core/policy.js (64 lines)</text><text x="1020.0" y="421.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">decideNotification: when is a</text><text x="1020.0" y="441.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">notification worth showing</text><rect x="1220" y="360" width="380" height="110" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="1410.0" y="401.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/core/presence.js (62 lines)</text><text x="1410.0" y="421.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">isWatching: is the user already</text><text x="1410.0" y="441.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">looking at this session's tab</text><rect x="20" y="540" width="1600" height="270" rx="18" fill="#d3f9d8" fill-opacity="0.55" stroke="#22c55e" stroke-width="1.5"/><text x="34.0" y="566.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">GNOME GLUE: talks to the operating system and the shell</text><rect x="40" y="590" width="400" height="200" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="240.0" y="656.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">extension.js (531 lines)</text><text x="240.0" y="676.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">THE ORCHESTRATOR</text><text x="240.0" y="696.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">enable() builds everything,</text><text x="240.0" y="716.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">disable() tears it all down.</text><text x="240.0" y="736.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">Timers: liveness 4 s, decay 15 s</text><rect x="470" y="590" width="345" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="642.5" y="631.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/spool.js (123)</text><text x="642.5" y="651.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">watch folder (inotify), read lines</text><rect x="470" y="700" width="345" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="642.5" y="741.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/procs.js (73)</text><text x="642.5" y="761.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">/proc: alive? who is the parent?</text><rect x="835" y="590" width="370" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1020.0" y="631.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/windows.js (188)</text><text x="1020.0" y="651.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">find the terminal, switch the tab</text><rect x="835" y="700" width="370" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1020.0" y="741.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/desktopstate.js (108)</text><text x="1020.0" y="761.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">which windows cover the desktop</text><rect x="1225" y="590" width="375" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1412.5" y="631.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/notifier.js (117)</text><text x="1412.5" y="651.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">GNOME notifications</text><rect x="1225" y="700" width="375" height="90" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="1412.5" y="741.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">lib/providers.js (40), prefs.js (158)</text><text x="1412.5" y="761.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.7" fill="#1e1e1e">agent names/icons, settings window</text><rect x="20" y="860" width="1600" height="140" rx="18" fill="#ffe8cc" fill-opacity="0.55" stroke="#f59e0b" stroke-width="1.5"/><text x="34.0" y="886.0" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16.6" fill="#343a40" font-weight="bold">UI: draws the actors you see (motion.js is shared by tiles and top bar)</text><rect x="40" y="905" width="400" height="80" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="240.0" y="941.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, 