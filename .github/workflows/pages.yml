name: Deploy site to GitHub Pages

# Builds the Astro landing page in site/ and publishes it to GitHub Pages.
# The demo island imports the extension's pure core (lib/core), so changes
# there redeploy the site too.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'extension/glanceagent@mehfooj.dev/lib/core/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Project pages live at https://<user>.github.io/<repo>/.
      # With a custom domain, set SITE_URL to it and BASE_PATH to "/".
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
